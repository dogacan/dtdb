[workspace]
members = [
    "dtdb_storage",
    "dtdb_relational",
    "dtdb_sql",
    "dtdb_api",
    "dtdb_bindings",
    "dtdb_benchmark",
    "dtdb_fuzz",
]
resolver = "2"

# Optimize release builds (and benches, which inherit this profile).
# Cross-crate inlining matters for the SQL -> relational -> storage hot path,
# and codegen-units = 1 reduces run-to-run benchmark variance.
[profile.release]
lto = "thin"
codegen-units = 1

# Release codegen with debug symbols, for sampling profilers (samply).
[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
# Workspace member paths
dtdb_storage = { path = "dtdb_storage" }
dtdb_relational = { path = "dtdb_relational" }
dtdb_sql = { path = "dtdb_sql" }
dtdb_api = { path = "dtdb_api" }

# Shared external dependencies
# `rc` enables Serialize/Deserialize for Arc<T>, which DbKey/DbValue payloads
# rely on (Arc<str>, Arc<[u8]>, Arc<Vec<DbKey>>). Without it the derives on
# those enums won't compile. Note: deserialization does not dedup Arcs.
serde = { version = "1.0", features = ["derive", "rc"] }
# `use-std` pulls in `alloc` (for `to_allocvec`) plus std error impls.
postcard = { version = "1", features = ["use-std"] }
thiserror = "1.0"
tempfile = "3.27.0"
tokio = "1.35"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
prost = "0.14"
futures-util = "0.3"
tracing = "0.1"
criterion = "0.5"
chrono = { version = "0.4.44", features = ["serde"] }
rust_decimal = { version = "1.42.0", features = ["serde"] }
parking_lot = "0.12"


