name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - uses: Swatinem/rust-cache@v2

    - name: Install Protocol Buffers Compiler
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check formatting
      run: cargo fmt --check

    - name: Clippy
      env:
        RUSTFLAGS: "-D warnings"
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      env:
        RUSTFLAGS: "-D warnings"
      run: cargo test --verbose

    - name: Bench smoke
      run: cargo bench --no-run

  tsan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust Nightly
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        components: rust-src

    - uses: Swatinem/rust-cache@v2

    - name: Install Protocol Buffers Compiler
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run tests with ThreadSanitizer
      run: ./scripts/run_tsan.sh

  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: llvm-tools-preview

    - uses: Swatinem/rust-cache@v2

    - name: Install Protocol Buffers Compiler
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate coverage (lcov)
      # Skip the C++ FFI smoke test: it shells out to a nested `cargo build`
      # which inherits llvm-cov's instrumentation env and fails against the
      # synthetic `llvm-cov-target` triple. It still runs in the `test` job.
      run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info -- --skip test_cpp_bridge_smoke

    - name: Coverage summary
      run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"

    - name: Upload to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        fail_ci_if_error: false

  fuzz:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - uses: Swatinem/rust-cache@v2

    - name: Install Protocol Buffers Compiler
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run dtdb_fuzz (short budget for PRs, long for nightly cron)
      env:
        # The cron job gets a generous budget; PRs/pushes use the script
        # defaults (1024 bolero iters, 256 proptest cases) so each run lands
        # in 1–3 minutes.
        BOLERO_FUZZ_ITERATIONS: ${{ github.event_name == 'schedule' && '50000' || '1024' }}
        PROPTEST_CASES: ${{ github.event_name == 'schedule' && '4096' || '256' }}
      run: ./scripts/run_fuzz.sh

  msan:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust Nightly
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        components: rust-src

    - uses: Swatinem/rust-cache@v2

    - name: Install Protocol Buffers Compiler
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run tests with MemorySanitizer (MSan)
      run: ./scripts/run_msan.sh
