coverage:
  status:
    patch:
      default:
        # Patch (diff) coverage is advisory only. Changes here legitimately add
        # defensive error-logging arms and timing-dependent background-task
        # branches that are impractical to cover with deterministic tests, so a
        # strict diff-coverage gate produces false negatives. Report the status
        # but never fail the check / block a merge on it.
        informational: true
    project:
      default:
        # Overall project coverage is advisory only — tracked for targeted
        # improvements but must never block a merge.
        informational: true
  ignore:
    - "dtdb_api/src/bin/dtdb_server.rs"
    - "dtdb_api/src/bin/dtdb_client_cli.rs"
    - "dtdb_fuzz"
    - "dtdb_storage/src/bin/dtdb_storage_cli.rs"
