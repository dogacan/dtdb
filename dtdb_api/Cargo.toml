[package]
name = "dtdb_api"
version = "0.1.0"
edition = "2024"

[dependencies]
dtdb_storage = { path = "../dtdb_storage" }
dtdb_relational = { path = "../dtdb_relational" }
dtdb_sql = { path = "../dtdb_sql" }
tonic = { version = "0.12", features = ["codegen", "transport", "tls"] }
prost = "0.13"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
futures-core = "0.3"
futures-util = "0.3"
pin-project = "1.0"
indexmap = { version = "1.9.3", features = ["std"] }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protobuf-src = "1.1.0"

[dev-dependencies]
tempfile = "3.27.0"
