syntax = "proto3";

package dtdb;

service DuctTapeDbService {
    rpc CreateDb (CreateDbRequest) returns (CreateDbResponse);
    rpc DropDb (DropDbRequest) returns (DropDbResponse);
    rpc ExecuteQuery (ExecuteQueryRequest) returns (stream ExecuteQueryResponse);
    rpc FlushDb (FlushDbRequest) returns (FlushDbResponse);

    // Bidirectional streaming RPC for multi-statement transactions.
    //
    // Protocol:
    //   1. Client sends StartTransaction with the target database name.
    //   2. Client sends one or more ExecuteTxQuery messages. For each query,
    //      the server streams back zero or more QueryResult responses followed
    //      by a QueryFinished marker (query_finished = true).
    //   3. Client sends CommitTransaction to commit, or RollbackTransaction
    //      to explicitly abort.
    //   4. If the client stream drops/disconnects at any point before Commit,
    //      the transaction is automatically rolled back.
    //
    // Misuse protection:
    //   - Sending multiple StartTransaction messages returns an error.
    //   - Sending Execute/Commit/Rollback before StartTransaction returns an error.
    //   - Sending Execute after Commit/Rollback returns an error.
    rpc Transaction (stream TransactionRequest) returns (stream TransactionResponse);
}

enum CompressionOption {
    COMPRESSION_UNCOMPRESSED = 0;
    COMPRESSION_LZ4 = 1;
}

enum IsolationLevel {
    READ_UNCOMMITTED = 0;
    READ_COMMITTED = 1;
    REPEATABLE_READ = 2;
    SNAPSHOT_ISOLATION = 3;
}

message CreateDbRequest {
    string db_name = 1;
    CompressionOption compression = 2;
    optional uint64 memtable_size_limit = 3;
    optional uint64 block_size_limit = 4;
    optional uint64 wal_size_limit = 5;
    optional uint64 flush_interval_ms = 6;
}

message CreateDbResponse {
    bool success = 1;
    string message = 2;
}

message DropDbRequest {
    string db_name = 1;
}

message DropDbResponse {
    bool success = 1;
    string message = 2;
}

message FlushDbRequest {
    string db_name = 1;
}

message FlushDbResponse {
    bool success = 1;
    string message = 2;
}

message ExecuteQueryRequest {
    string db_name = 1;
    string sql_query = 2;
}

message ExecuteQueryResponse {
    oneof payload {
        Header header = 1;
        Row row = 2;
        string info_message = 3;
    }
}

message Header {
    repeated string column_names = 1;
}

message Row {
    repeated string values = 1;
}

// --- Transaction streaming messages ---

message TransactionRequest {
    oneof command {
        StartTransaction start = 1;
        ExecuteTxQuery execute = 2;
        CommitTransaction commit = 3;
        RollbackTransaction rollback = 4;
    }
}

message StartTransaction {
    string db_name = 1;
    optional IsolationLevel isolation_level = 2;
}

message ExecuteTxQuery {
    string sql_query = 1;
}

message CommitTransaction {}
message RollbackTransaction {}

message TransactionResponse {
    oneof payload {
        ExecuteQueryResponse query_result = 1;
        CommitResult commit_result = 2;
        string error_message = 3;
        bool query_finished = 4;
    }
}

message CommitResult {
    bool success = 1;
    string message = 2;
}
