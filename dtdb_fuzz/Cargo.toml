[package]
name = "dtdb_fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
dtdb_storage = { path = "../dtdb_storage" }
dtdb_relational = { path = "../dtdb_relational" }
dtdb_sql = { path = "../dtdb_sql" }
dtdb_api = { path = "../dtdb_api" }

[dev-dependencies]
bolero = "0.13"
proptest = "1.6"
tempfile = "3.8"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
bincode = "1.3"
tonic = { version = "0.12", default-features = false }
futures-util = "0.3"

[[test]]
name = "wal_recovery"
path = "fuzz_targets/wal_recovery.rs"

[[test]]
name = "sstable_reader"
path = "fuzz_targets/sstable_reader.rs"

[[test]]
name = "concurrent_txns"
path = "fuzz_targets/concurrent_txns.rs"

[[test]]
name = "sql_op_sequence"
path = "fuzz_targets/sql_op_sequence.rs"
