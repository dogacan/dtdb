[package]
name = "dtdb_fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
dtdb_storage = { workspace = true }
dtdb_relational = { workspace = true }
dtdb_sql = { workspace = true }
dtdb_api = { workspace = true }

[dev-dependencies]
bolero = "0.13"
proptest = "1.6"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
bincode = { workspace = true }
tonic = { workspace = true }
futures-util = { workspace = true }

[[test]]
name = "wal_recovery"
path = "fuzz_targets/wal_recovery.rs"

[[test]]
name = "sstable_reader"
path = "fuzz_targets/sstable_reader.rs"

[[test]]
name = "concurrent_txns"
path = "fuzz_targets/concurrent_txns.rs"

[[test]]
name = "sql_op_sequence"
path = "fuzz_targets/sql_op_sequence.rs"
