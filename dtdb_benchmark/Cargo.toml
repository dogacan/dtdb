[package]
name = "dtdb_benchmark"
version = "0.1.0"
edition = "2024"

[dependencies]
dtdb_storage = { workspace = true }
dtdb_relational = { workspace = true }
dtdb_sql = { workspace = true }

# Optional: only pulled in for the dtdb-vs-SQLite comparison bench. The
# `bundled` feature compiles SQLite from source (needs a C compiler), so it is
# gated behind the `compare-sqlite` feature to keep the default build — and the
# CI `cargo bench --no-run` smoke test — free of any C toolchain dependency.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

# Pulled in (with rusqlite) only for the comparison bench: the client-interface
# INSERT case drives dtdb through the in-process `DuctTapeDbClient` +
# `run_in_transaction` + `sql_query!`, which needs the API crate and an async
# runtime. Gated behind `compare-sqlite` so the default build stays lean.
dtdb_api = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"], optional = true }
futures-util = { workspace = true, optional = true }

# Optional: only pulled in for the dtdb-vs-RocksDB comparison bench.
# Gated behind the `compare-rocksdb` feature to avoid compiler toolchain dependencies by default.
# postcard is the byte serializer the bench feeds to RocksDB (which stores raw bytes),
# mirroring the serialization dtdb_storage does internally.
rocksdb = { version = "0.21.0", default-features = false, features = ["lz4"], optional = true }
postcard = { workspace = true, optional = true }

[features]
compare-sqlite = ["dep:rusqlite", "dep:dtdb_api", "dep:tokio", "dep:futures-util"]
compare-rocksdb = ["dep:rocksdb", "dep:postcard"]

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "dml_benchmark"
harness = false

[[bench]]
name = "storage_benchmark"
harness = false

[[bench]]
name = "dtdb_vs_sqlite"
harness = false

[[bench]]
name = "dtdb_vs_rocksdb"
harness = false
